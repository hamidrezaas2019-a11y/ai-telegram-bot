# ============================================================
# WRANGLER CONFIG - AI Telegram Bot
# ============================================================

name = "ai-telegram-bot"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# 🗄️ D1 DATABASE
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "ai-bot-db"
database_id = "51a80407-ac3a-43ea-9e67-5fa8115b2b19"

# ============================================================
# 📦 KV STORAGE
# ============================================================
[[kv_namespaces]]
binding = "AI_KV"
id = "fe7bd7f271cf43469fe651bfde3a0e05"

# ============================================================
# 🔑 ENVIRONMENT VARIABLES (کلیدهای API)
# ============================================================
[vars]
