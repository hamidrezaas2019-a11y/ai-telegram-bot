name = "ai-telegram-bot"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# 🗄️ D1 DATABASE
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "ai-bot-db"
database_id = "5c8f2a1b-3d4e-5f6a-7b8c-9d0e1f2a3b4c"  # ← YOUR_DATABASE_ID_HERE

# ============================================================
# 🌐 VARIABLES
# ============================================================
[vars]
ENVIRONMENT = "production"
WEBHOOK_URL = "https://ai-telegram-bot.hamidreza-as2019.workers.dev/webhook"
MINIAPP_URL = "https://ai-telegram-bot.hamidreza-as2019.workers.dev/miniapp"

# ============================================================
# ⏰ CRON TRIGGERS
# ============================================================
[triggers]
crons = ["0 0 * * *"]  # هر روز ساعت 00:00

# ============================================================
# 📦 OBSERVABILITY
# ============================================================
[observability]
enabled = true
head_sampling_rate = 1.0
